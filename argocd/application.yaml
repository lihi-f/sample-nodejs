# Bootstrap once: kubectl apply -n argocd -f argocd/
# Replace OWNER/sample-nodejs with this GitHub repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nodejs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/sample-nodejs.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-nodejs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
