name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for a main release
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

env:
  APP_DIR: app
  HELM_DIR: helm
  NODE_VERSION: "22"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      app: ${{ steps.filter.outputs.app }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            app:
              - 'app/**'
            helm:
              - 'helm/**'
              - 'argocd/**'

  metadata:
    name: Release metadata
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - id: meta
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./${APP_DIR}/package.json').version")"
          RELEASE=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            VERSION="$(npm version "$BUMP" --no-git-tag-version --prefix "$APP_DIR" | sed 's/^v//')"
            RELEASE=true
          fi
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: [changes, metadata]
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ env.APP_DIR }}
      - run: npm test
        working-directory: ${{ env.APP_DIR }}

  npm-audit:
    name: Dependency audit
    needs: [changes, metadata]
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: ${{ env.APP_DIR }}

  semgrep:
    name: SAST
    needs: [changes, metadata]
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD:/src:ro" -w /src/app semgrep/semgrep:1.110.0 \
            semgrep scan --config p/javascript --config p/owasp-top-ten --severity ERROR --error .

  helm:
    name: Validate Helm chart
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.helm == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: |
          helm lint "$HELM_DIR" -f "$HELM_DIR/values-prod.yaml"
          helm template sample-nodejs "$HELM_DIR" -f "$HELM_DIR/values-prod.yaml" >/dev/null

  build-and-scan:
    name: Build and scan image
    needs: [changes, metadata, test, npm-audit, semgrep, helm]
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          load: true
          platforms: linux/amd64
          tags: sample-nodejs:scan
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ needs.metadata.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # - uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     image-ref: sample-nodejs:scan
      #     format: table
      #     severity: HIGH,CRITICAL
      #     exit-code: "1"
      #     ignore-unfixed: "false"

  publish:
    name: Publish image
    needs: [metadata, build-and-scan]
    if: needs.metadata.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.sha }}
            ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.version }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ needs.metadata.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.sha }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Update app version
    needs: [metadata, publish]
    if: needs.metadata.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - env:
          VERSION: ${{ needs.metadata.outputs.version }}
          SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --prefix "$APP_DIR"
          sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "$HELM_DIR/Chart.yaml"
          sed -i -E "s/^(  tag: ).*/\1\"${SHA}\"/" "$HELM_DIR/values.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIR/package.json" "$APP_DIR/package-lock.json" "$HELM_DIR/Chart.yaml" "$HELM_DIR/values.yaml"
          git commit -m "chore: release v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD --tags
